version: '3.8'

services:
  backend:
    build: .
    container_name: microplastic_vision_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://microplastic:microplastic_pass@postgres:5432/microplastic_db
      - LOG_LEVEL=INFO
      - MAX_UPLOAD_SIZE_MB=50
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: microplastic_vision_postgres
    environment:
      POSTGRES_USER: microplastic
      POSTGRES_PASSWORD: microplastic_pass
      POSTGRES_DB: microplastic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microplastic -d microplastic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
